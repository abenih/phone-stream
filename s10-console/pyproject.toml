[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "s10-console"
version = "0.1.0"
description = "USB-first, explicitly authorized Galaxy S10 desktop control"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["PySide6-Essentials==6.11.2"]

[project.scripts]
s10-console = "s10_console.app:main"
s10-console-install-launcher = "s10_console.desktop:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-qt>=4.4,<5",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/s10_console"]

[tool.hatch.build.targets.wheel]
packages = ["src/s10_console"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "s10_console/resources/docs"

[tool.hatch.build.targets.sdist]
include = [
  "/src/s10_console/**/*.py",
  "/src/s10_console/resources/s10-console.svg",
  "/tests/*.py",
  "/docs/*.md",
  "/fixtures/clipboard/audio_probe.py",
  "/fixtures/clipboard/README.md",
  "/README.md",
  "/pyproject.toml",
  "/uv.lock",
  "/.gitignore",
]
